[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowdim-opponent-games"
version = "0.1.0"
description = "Reproducible experiments for vector-payoff games with low-dimensional opponent behavior"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
cage = ["paramiko>=3,<6", "PyYAML>=6,<7", "prettytable>=3,<4"]

[project.scripts]
lowdim-games = "lowdim_games.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
